<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Media - ANANTAXMEIOS</title>


<style>


body{

margin:0;
font-family:Arial,sans-serif;
background:#f8fcff;
color:#526273;

}



header{

padding:25px 7%;
background:white;

}



.logo{

font-size:28px;
font-weight:bold;
letter-spacing:3px;

background:linear-gradient(90deg,#4A90E2,#D4AF37);
-webkit-background-clip:text;
color:transparent;

}



.form{

max-width:600px;

margin:50px auto;

background:white;

padding:35px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.08);

}



h1{

color:#3d82d8;
text-align:center;

}



input,textarea,select{

width:100%;
padding:14px;

margin-top:15px;

border:1px solid #ddd;

border-radius:10px;

}



textarea{

height:120px;

}



button{

margin-top:25px;

width:100%;

padding:15px;

border:0;

border-radius:30px;

background:#4A90E2;

color:white;

font-size:16px;

}



footer{

text-align:center;
padding:30px;

}



</style>

</head>


<body>


<header>

<div class="logo">
ANANTAXMEIOS
</div>

</header>




<div class="form">


<h1>
Upload Media
</h1>


<input placeholder="Judul Media">


<select>

<option>
Foto
</option>

<option>
Video
</option>

</select>



<input type="file">



<textarea placeholder="Deskripsi Media"></textarea>



<input placeholder="Harga (Opsional)">



<button>
Upload Media
</button>



</div>



<footer>

© 2026 ANANTAXMEIOS

</footer>
