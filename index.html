<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANANTAXMEIOS</title>
<link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(#EAF6FF, #FFFFFF);
            color: #5F6B7A;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            animation: fadeIn 2s ease;
        }

        .logo {
            font-size: 45px;
            font-weight: bold;
            color: #4A90E2;
            letter-spacing: 3px;
        }

        .tagline {
            font-size: 18px;
            margin-top: 15px;
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: #D4AF37;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            transition: 0.3s;
        }

        .button:hover {
            transform: translateY(-5px);
        }

        .cloud {
            position: absolute;
            top: 20%;
            left: 10%;
            font-size: 60px;
            opacity: 0.5;
            animation: moveCloud 12s infinite alternate;
        }

        @keyframes moveCloud {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(80px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>

<body>
<header>
    <div class="logo">
        ANANTAXMEIOS
    </div>

    <nav>
        <a href="#">Home</a>
        <a href="#">Explore</a>
        <a href="#">Media</a>
        <a href="#">Blog</a>
        <a href="#">About</a>
    </nav>
</header>
<div class="cloud">☁️</div>

<div class="container">

    <div class="logo">
        ANANTAXMEIOS
    </div>

    <div class="tagline">
        Infinite • Calm • Creative
    </div>

    <a href="#" class="button">
        Explore
    </a>

</div>

</body>
</html>
