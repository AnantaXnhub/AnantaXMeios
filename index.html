<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ANANTAXMEIOS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    font-family:Arial, sans-serif;

    background:
    linear-gradient(
        180deg,
        #EAF6FF,
        #FFFFFF
    );

    color:#5F6B7A;

    min-height:100vh;

    overflow-x:hidden;

}



/* HEADER */

header{

    width:100%;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:25px 40px;

}



.logo{

    font-size:32px;

    font-weight:bold;

    letter-spacing:3px;


    background:
    linear-gradient(
        90deg,
        #4A90E2,
        #D4AF37
    );


    -webkit-background-clip:text;

    color:transparent;

}



nav a{

    margin-left:20px;

    text-decoration:none;

    color:#5F6B7A;

    transition:.3s;

}


nav a:hover{

    color:#4A90E2;

}



/* CONTENT */

.container{

    text-align:center;

    margin-top:120px;

    animation:fadeIn 2s ease;

}



.tagline{

    font-size:18px;

    margin-top:15px;

    letter-spacing:1px;

}



.button{

    display:inline-block;

    margin-top:30px;

    padding:12px 35px;


    background:

    linear-gradient(
        90deg,
        #D4AF37,
        #EBCB62
    );


    color:white;

    text-decoration:none;

    border-radius:30px;


    box-shadow:

    0 8px 20px rgba(212,175,55,.25);


    transition:.3s;

}



.button:hover{

    transform:translateY(-5px);

}



/* CLOUD */

.cloud{

    position:absolute;

    top:20%;

    left:10%;

    font-size:60px;

    opacity:.5;

    animation:moveCloud 12s infinite alternate;

}



/* ANIMATION */

@keyframes moveCloud{

    from{

        transform:translateX(0);

    }


    to{

        transform:translateX(80px);

    }

}



@keyframes fadeIn{

    from{

        opacity:0;

        transform:translateY(20px);

    }


    to{

        opacity:1;

        transform:translateY(0);

    }

}



/* MOBILE */

@media(max-width:700px){

header{

    padding:20px;

    flex-direction:column;

    gap:20px;

}


.logo{

    font-size:25px;

}


nav a{

    margin:0 8px;

}


.container{

    margin-top:80px;

}


}

</style>

</head>


<body>


<header>

<div class="logo">

ANANTAXMEIOS

</div>


<nav>

<a href="#">Home</a>

<a href="#">Explore</a>

<a href="#">Media</a>

<a href="#">Blog</a>

<a href="#">About</a>

</nav>


</header>



<div class="cloud">

☁️

</div>



<div class="container">


<div class="tagline">

Infinite • Calm • Creative

</div>



<a href="#" class="button">

Explore

</a>



</div>



</body>

</html>
