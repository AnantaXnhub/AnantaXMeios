<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Explore - ANANTAXMEIOS</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#EAF6FF;
    color:#526273;
}


header{
    padding:25px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:white;
}


.logo{
    font-size:28px;
    font-weight:bold;
    color:#4A90E2;
}


nav a{
    margin-left:20px;
    text-decoration:none;
    color:#526273;
}


.hero{
    text-align:center;
    padding:60px 20px;
}


.hero h1{
    color:#4A90E2;
    font-size:45px;
}


.grid{

    width:85%;
    margin:auto;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));

    gap:25px;

}


.card{

    background:white;

    border-radius:20px;

    overflow:hidden;

    box-shadow:0 10px 25px rgba(0,0,0,.08);

}


.card img{

    width:100%;
    height:200px;
    object-fit:cover;

}


.info{

    padding:20px;

}


.info h3{

    color:#4A90E2;

}


.info span{

    color:#D4AF37;

}


footer{

    text-align:center;
    padding:30px;

}

</style>


</head>


<body>


<header>

<div class="logo">
ANANTAXMEIOS
</div>


<nav>

<a href="index.html">Home</a>
<a href="explore.html">Explore</a>
<a href="foto.html">Foto</a>
<a href="video.html">Video</a>

</nav>


</header>





<section class="hero">

<h1>
Explore Media
</h1>

<p>
Temukan foto, video, dan karya kreatif.
</p>

</section>





<div class="grid" id="mediaList">

</div>





<footer>

© 2026 ANANTAXMEIOS

</footer>




<script src="content.js"></script>


<script>


const list = document.getElementById("mediaList");


media.forEach(item => {


list.innerHTML += `

<div class="card">


<img src="${item.gambar}">


<div class="info">


<span>
${item.kategori}
</span>


<h3>
${item.judul}
</h3>


<p>
${item.deskripsi}
</p>


</div>


</div>

`;


});


</script>



</body>

</html>
